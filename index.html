<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Ventas y Courier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

<div class="login-container">
    <div class="card login-card p-4">
        <div class="text-center mb-4">
            <i class="bi bi-box-seam text-primary display-4"></i>
            <h3 class="mt-2">Iniciar Sesión</h3>
            <p class="text-muted">Sistema de Ventas y Courier</p>
        </div>
        
        <div id="login-error" class="alert alert-danger d-none" role="alert">
            Usuario o contraseña incorrectos.
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="admin" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="admin" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Ingresar</button>
        </form>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
